# intent_service.py 业务规则（）
# 加载入口：app.services.config_loader.get_config_loader().load("intent")
# 启动期一次加载；改完需重启服务（roadmap §3.5）
# ⚠️ 单一真相源：app/services/intent_service.py 是唯一消费者
#   注意：app/services/chat/prompt_assembler.py 有 _ORDER_NO_RE 独立副本
#         （与本文件 ORDER_NO_RE_PATTERN 语义相同；M13 同步过）
#         本次不合并（跨模块 + YAGNI）；保持两份配置一致性

# 意图分类规则（顺序敏感：chitchat → refund_query → policy_query → order_query → product_query → policy_query 兜底）
# 顺序说明：
#   1. refund_query 必须最先（"我要退款" 不能被 "怎么退款" 误命中 — policy 在前会抢匹配）
#   2. policy_query 含 "7 天无理由"（询问类应走 policy）+ 流程咨询（"怎么退款"）+ 通用政策（包邮/发票/促销）
#   3. order_query 订单/物流/快递
#   4. product_query 商品参数/价格/SKU
# 未命中前 5 类默认走 policy_query（见 intent_service.classify 默认逻辑）
INTENT_RULES:
  #  chitchat 规则放宽
  # 旧规则严格整段匹配（"你好[标点]*$"），"你好，在吗" 等复合 query 漏匹配 → fall through LLM 35s+
  # 新规则：开头是"你好/您好/在吗/在不在"任意内容 → chitchat（接受 5% 边界误识别——chitchat 短路只回 1 句"在的~"，用户会再追问具体问题）
  # "hi/hello/hey" 仍是严格整段（英文短，本身少串扰）
  chitchat:
    - '^你好'                          # 你好/你好，在吗/你好请问尺码都归 chitchat
    - '^您好'
    - '^在吗'                          # 在吗/在吗？/在吗 在吗 都覆盖
    - '^在不在'
    - '^在么'                          #  P1-F：在么（含 ？，）/在么 在么 — 同"在吗"语义
    - '^hi[!?。,\s]*$'                 # hi/hi!/hi,（严格）
    - '^hello[!?。,\s]*$'              # hello/hello!/hello,（严格）
    - '^hey[!?。,\s]*$'                # hey/hey!/hey,（严格）
  # ==========================================================
  # 服饰电商域意图规则
  # 原则：**纯增量**——通用电商词条全部保留，只替词。
  # 分类语义按"动作 vs 咨询"切分：
  #   要办事（退货/换码/改地址）→ X_query 动作桶
  #   问知识（尺码怎么选/运费谁出/起球正常吗）→ policy_query 咨询桶
  # 这条边界很关键：把"起球"放进动作桶会让"毛衣起球正常吗"
  # 走进退换流程，而用户其实只想知道是不是质量有问题。
  # ==========================================================
  # refund_query：退款/退货/换货/换码（必须含明确个人意愿，避免询问流程被误命中）
  refund_query:
    - '我要退款'
    - '我要退货'
    - '我要退换'
    - '我要换货'
    - '我要申请退款'
    - '我要申请退货'
    - '我要发起退款'
    - '想退'
    - '想退掉'
    - '想退款'
    - '想申请退款'
    - '想申请退货'
    - '想发起退款'
    - '不想要了'
    - '能退吗'
    - '可以退'
    - '能不能退'
    - '还能退吗'
    - '能退款吗'
    - '能申请退款吗'
    - '可以申请退款吗'
    # ---- 服饰售后：换码受理（动作意图，需带订单走流程）----
    - '我要换码'
    - '申请换码'
    - '想换码'
    - '换个尺码'
    - '换大一码'
    - '换小一码'
  # policy_query：政策类（尺码/退换规则/活动/促销/包邮/发票/流程咨询/发货时效 等通用规则）
  policy_query:
    - '7\s*天无理由'
    - '七天无理由'
    - '无理由退'
    - '怎么.*退款'
    - '怎么.*退货'
    - '怎么.*退换'
    - '如何.*退款'
    - '如何.*退货'
    - '退款流程'
    - '退货流程'
    - '退款怎么'
    - '退货怎么'
    # （I2 修复 2026-10-10）：退款到账时效属政策问答；此前规则零覆盖
    # → 落 LLM 兜底误判 refund_query 弹订单选择器，政策问题从未被答
    - '退款.*到账'
    - '退款.*工作日'
    - '退款.*多久'
    # 发货时效咨询（问规则 → policy）；第一人称"我买的…什么时候发货"是查自己订单，
    # 用负向排除让位给 order_query 桶（桶序 policy 在前，不排除会抢匹配）
    - '^(?!.*(?:我买|我的|我那)).*什么时候(?:能|会|可以)?发货'
    - '^(?!.*(?:我买|我的|我那)).*多久(?:能|会|可以)?发货'
    - '^(?!.*(?:我买|我的|我那)).*几天(?:能|会|可以)?发货'
    - '发货时间'
    # ---- 服饰售后：尺码 / 退换 / 面料（咨询意图，走 RAG 条款引用）----
    - '穿什么码'
    - '什么码'
    - '多大码'
    - '尺码.*推荐'
    - '尺码.*选'
    - '选码'
    - '偏大'
    - '偏小'
    - '运费险'
    - '质量问题'
    - '起球'
    - '色差'
    - '开线'
    - '脱线'
    - '掉色'
    - '缩水'
    - '浮色'
    - '破损'
    - '七天'
    - '无理由'
    - '二次销售'
    - '什么面料'
    - '什么成分'
    - '面料.*含'
    - '含.*羊毛'
    - '预售'
    - '包邮'
    - '满减.*门槛'
    - '包邮.*多少'
    - '满多少.*包'
    - '邮费'
    - '运费'
    - '发票'
    - '活动'
    - '促销'
    - '折扣'
    - '优惠券'
    - '满减'
    # ---- 订单信息修改规则（咨询桶：问"能不能改"要答政策，不是直接改）----
    # 边界：动作请求（"我要改地址"）走 order_query 进订单流程；
    #      疑问/规则类留在这里答"发货后不能自助改，需人工"。
    - '还能.*(改|修改).*(地址|电话|手机号)'
    - '(发货|已发).*(还能|可以|能).*(改|修改)'
    # 服饰域：改码/换码的**规则咨询**（"还没发货能换码吗"）走政策问答，
    # 不是订单动作——否则 order 桶的裸词"发货"会抢走 RAG 路径
    - '(换码|改码|改尺码|换尺码).*(吗|怎么|能不能|行不行)'
    - '(还没|未|没有).*发货.*(换|改)'
    - '(地址|电话|手机号).*(填错|写错|错)'
    - '(改|修改).*(地址|电话).*(规则|政策|要求|收费)'
  # order_query：订单/物流/快递/发货
  order_query:
    - '查订单'                         # V18：golden set easy case，此前只能靠 LLM 兜底（限流时落 default）
    - '查一下.*订单'
    - '最近.*订单'
    - '我的订单'
    - '我的那.*订单'
    - '订单状态'
    - '物流'
    - '快递'
    - '到哪'
    - '到货'
    - '发货'
    - '派送'
    - '签收'
    - '运单'
    - '单号'
    # ---- 订单信息修改（动作请求，进订单流程后再调写操作工具）----
    - '我要改地址'
    - '帮我改地址'
    - '改一下地址'
    - '改收货地址'
    - '我要改电话'
    - '帮我改电话'
    - '改一下电话'
    - '改收件人'
  # product_query：商品参数/价格/库存/SKU
  product_query:
    #  闲聊兜底 rule 已上移到 chitchat 类（整段问候"你好"等）
    # 保留"你好.*想/问"+"请教"+"麻烦.*咨询" — 复合 query（含实质意图）
    - '你好.*想'
    - '您好.*问'
    - '请教'
    - '麻烦.*咨询'
    # 列表型/在售咨询（"你们有哪些产品"此前漏匹配 → policy 兜底答"没有信息"）
    - '哪些产品'
    - '哪些商品'
    - '有什么产品'
    - '有什么商品'
    - '卖什么'
    - '产品列表'
    - '商品列表'
    - '在售'
    - '多少钱'
    - '价格'
    - '参数'
    - '规格'
    - '克重'
    - '颜色'
    - '尺码'
    - '尺寸'
    - '胸围'
    - '腰围'
    - '臀围'
    - '衣长'
    - '肩宽'
    - '袖长'
    - '裤长'
    - '腿围'
    - '版型'
    - '修身'
    - '宽松'
    - '号型'
    - '货号'
    - '款号'
    - '有没有货'
    - '库存'
    - '在哪买'
    - '推荐'
    - 'ZP\d'
    - 'BP\d'
    - 'LP\d'
    - 'HM\d{5,6}'
    - 'MY\d{5,6}'
    - 'MS\d{5,6}'
    - 'HKZ\d{5,6}'
    - '几色'
    - '几个颜色'

# 订单号格式（M13 修复：原 regex `\bORD\d{3,}\b` 不能匹配字母后缀订单如 ORD20260704899EBA）
# 与 prompt_assembler._ORDER_NO_RE 对齐：ORD + 8位日期 + 3-6位大写字母数字
ORDER_NO_RE_PATTERN: 'ORD\d{8}[A-Z0-9]{3,6}'
ORDER_NO_RE_FLAGS: IGNORECASE

# SKU 格式（2026-11 服饰域扩展）：
#   - 旧电商：ZP / BP / LP 前缀 + 1-3 位数字（保留，黄金集与历史单测依赖）
#   - 服饰货号：HM / MY / MS / HKZ 前缀 + 5-6 位数字，如 HM261139 / MY154 补全位 / HKZ26946
#     \b 边界仍保留：避免在长英文串中误匹配
SKU_RE_PATTERN: '\b(?:(?:ZP|BP|LP)\d{1,3}|(?:HM|MY|MS|HKZ)\d{5,6})\b'
SKU_RE_FLAGS: IGNORECASE