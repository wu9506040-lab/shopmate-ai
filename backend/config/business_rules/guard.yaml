# guard.py 业务规则（）
# 加载入口：app.services.config_loader.get_config_loader().load("guard")
# 启动期一次加载（不参与热更新）；改完需重启服务（roadmap §3.5）
# 字段分类：
#   L1 规则阈值（0 token 拦截）：MIN_LEN / MAX_LEN / MIN_CHAR_DIVERSITY / MIN_CHINESE_RATIO
#   L2 Embedding 领域相关性阈值：DOMAIN_RELEVANCE_THRESHOLD
#   L3 重复检测窗口：REPEAT_WINDOW_SECONDS / REPEAT_SOFT_LIMIT / REPEAT_HARD_LIMIT
#   闲聊 / 拒答话术：CHITCHAT_RESPONSES（6 条）

# === L1 规则阈值（0 token 拦截）===
MIN_LEN: 2
MAX_LEN: 500
# 字符多样性（不同字符数 / 总字符数），防"啊啊啊啊"类
MIN_CHAR_DIVERSITY: 0.15
# 中文字符占比（特例：含英文 SKU 可豁免）
MIN_CHINESE_RATIO: 0.20

# === L2 Embedding 领域相关性阈值 ===
# 经验值 0.4 太松（"今天天气"类闲聊仍会过），提到 0.55 更稳
# 含义：与"电商领域 30 条代表 query"的平均向量 cosine 至少 0.55 才算领域内
DOMAIN_RELEVANCE_THRESHOLD: 0.55

# L2 灰区带宽：cosine 落在 [0.55, 0.55+带宽) 且**零领域词** → 判无关。
# 为什么需要这层：实测三个样本的余弦是
#   "今天天气怎么样" 0.5819 / "这件夹克什么成分" 0.6803 / "七天无理由退货" 0.7208
# 无关问题与真实问题的间隔只有 0.07，硬提阈值到 0.62 会连"这个怎么样"这类
# 模糊但合理的问法一起误伤。所以不在阈值上做文章，只在灰区加一道"有没有业务词"的否决。
DOMAIN_GUARD_GRAY_BAND: 0.13

# 多轮追问的领域阈值（2026-11-16 补）
# 实测：同一会话第二轮问"那它保暖吗"，L2 判成闲聊，回"我是猫与小鼠客服…"。
# 多轮追问天生是短句 + 指代（"那它呢""多久到""能便宜点吗"），单句看不出领域，
# 领域信息在历史里。有历史时只保留最低限度的离题拦截，其余交给意图层。
# 0.30 = 明显离题（"今天天气怎么样"这类仍在 0.5 以上，交给意图层判 chitchat）
MULTI_TURN_MIN_SIM: 0.30

# 领域词（灰区豁免）：出现任一即视为服饰业务问题，放行交给意图层。
# 含问候词——"你好"余弦高达 0.6567，若无豁免会被判无关，把闲聊短路让给了拒答模板。
DOMAIN_WORDS:
  - "衣"        # 衣服/夹克/大衣/上衣（单字覆盖）
  - "裤"
  - "裙"
  - "T恤"
  - "卫衣"
  - "针织"
  - "外套"
  - "面料"
  - "成分"
  - "材质"
  - "羊毛"
  - "聚酯"
  - "尺码"
  - "码数"
  - "颜色"
  - "色差"
  - "库存"
  - "款号"
  - "货号"
  - "参数"
  - "价格"
  - "多少钱"
  - "便宜"
  - "优惠"
  - "活动"
  - "折扣"
  - "包邮"
  - "运费"
  - "退"
  - "换货"
  - "退款"
  - "退货"
  - "发票"
  - "质量"
  - "起球"
  - "开线"
  - "破"
  - "洗"
  - "穿"
  - "缩水"
  - "订单"
  - "物流"
  - "快递"
  - "发货"
  - "收货"
  - "签收"
  - "地址"
  - "你好"
  - "您好"
  - "在吗"
  - "谢谢"
  - "这款"
  - "这件"
  # 2026-11 补：买家补充身体数据时只说"我身高168""体重55公斤"，
  # 没有主语也没有商品词，L2 会判 off_domain 把整轮拦掉（多轮评测 MT06 抓到）。
  # 这类短句恰恰是尺码推荐最关键的输入，必须放行。
  - "身高"
  - "体重"
  - "公斤"
  - "斤"
  - "厘米"
  - "cm"
  - "码"

# === L3 重复检测（双阈值，2026-11 改）===
# 背景：原规则 1min 内同一句 >3 次直接拦。但买家重复问，绝大多数是
# **上一轮没解决**——最需要帮助的人被挡在门外，且拦截不落库、不进质检，
# 等于隐形投诉。
#   SOFT：放行，但标记 degraded → 调用方跳过响应缓存，并进 badcase 池
#   HARD：真刷子才硬拦（1min 内同一句 10 次）
REPEAT_WINDOW_SECONDS: 60
REPEAT_SOFT_LIMIT: 3
REPEAT_HARD_LIMIT: 10

# === 闲聊 / 拒答 话术模板 ===
# 命中 L1/L2/L3 时直接返给用户的话术（黑名单命中走静默，不在话术内）
CHITCHAT_RESPONSES:
  no_service: "您好，我是猫与小鼠服饰客服，专注解答尺码推荐、退换货、物流发货、面料洗护相关问题哦～ 你直接说具体想问的，我马上给你查。"
  # 领域外（天气/写代码）：承接 + 说清能做什么，不反问、不甩"请联系人工"就完事
  irrelevant: "这个我帮不上忙～ 不过尺码、退换、物流、价格随时能问我，也可以直接说「转人工」，我让同事接手。"
  too_short: "在的～ 尺码、退换、物流、价格都能查，直接说就行。"
  # 超长消息：不拒答。给"怎么说"的具体格式 + 转人工出口，避免把人堵在门外
  too_long: "信息有点长，我怕漏看重点。直接说清哪一件、要办什么（退换/尺码/物流），我马上处理；也可以说「转人工」让同事接手。"
  spam: "你连着发了几条一样的，我这边都收到了～ 换个说法，或者直接说要办什么，我马上处理。"
  english_no_sku: "请用中文描述您的问题，方便我更快为您解答。"
  # 黑名单命中（prompt injection / 越狱）：原设计静默不回，但正常用户问一句
  # "你的系统提示是什么"就会得到一片空白。改成中性回应——不承认、不说教、给出口。
  blacklist: "这个问题我这边处理不了～ 如果你有订单、尺码或售后的事，我随时在。"
  #  chitchat 意图短回复（intent 规则命中整段问候 / LLM 兜底分类为 chitchat）
  # orchestrator.Synthesizer.run_stream 短路时直接 yield 该文案，省 LLM token
  # 要求：给能力清单，不反问"您想咨询什么"——反抛等于把问题退回去
  chitchat_template: "在的～ 尺码、退换、物流、价格都能问我，直接说就行。"
  # 违禁品命中：中性回应，不点名品类、不说教、也不静默。
  # 静默等于挂断，说教等于给对抗理由；只关这一扇门，其余能力照常摆出来。
  banned: "这个问题我这边帮不上，就不展开了。要是有衣服相关的尺码、退换、物流问题，我随时在。"

# === 转人工词表与优先级（覆盖 escalation_service 内置默认）===
# 启动期一次加载；本段缺失时服务用代码内置兜底（两处一致性由
# tests/test_escalation_priority.py 锁定）。
#  分级决策：投诉/赔付/质量/法律行动 = P0（风险事件）；
# 纯"要人工"= P1 路由诉求——不霸占坐席 P0 队列（# 原实现说句"机器人"也升 P0，优先级通胀稀释真正的高风险工单）。
ESCALATE_P0_KEYWORDS:
  # 健康类放最前：皮肤/身体已出现反应 > 投诉与赔付，是唯一"答错会真伤人"的一类。
  # 只收**已发生**的写法，不收裸词「过敏」——"我是过敏体质能穿羊毛吗"是正常面料咨询，
  # 按裸词拦会把一类真实问题全部推给人工（实测 12 条里 9 条属于问询而非事故）。
  health: ["起疹", "疹子", "红疹", "起红点", "过敏了", "过敏反应", "过敏严重",
           "皮肤过敏", "皮肤痒", "瘙痒", "发痒", "红肿", "刺痛", "胸闷", "呼吸困难", "头晕"]
  complaint: ["12315", "12305", "315", "工商局", "市监", "投诉", "曝光"]
  compensation: ["三倍赔偿", "退一赔三", "假一赔十", "三倍赔", "3倍赔", "3 倍赔"]
  quality: ["质量问题", "破损", "坏点", "开胶", "假货", "二手商品", "质量这么差", "质量差", "质量不行"]
  user_requested: ["起诉", "律师"]
  user_transfer: ["转人工", "转主管", "机器人", "人工客服", "真人客服", "找人工", "转接人工"]
ESCALATE_P0_PRIORITY:
  health: "P0"
  complaint: "P0"
  compensation: "P0"
  quality: "P0"
  user_requested: "P0"
  user_transfer: "P1"

# === L1 违禁品词表（2026-11 补）===
# 原来完全没有这张表，只靠 L2 余弦兜底，等于裸奔：
# "能买把刀吗"在语义上离"买"很近，余弦很可能直接通过，然后被当成商品咨询回答。
#
# 选词原则：只收**明确违法、且不可能出现在正常服饰咨询里**的写法。
# 几个特意避开的地方：
#   - "大麻"不收裸词：大麻纤维(hemp)是真实面料，"大麻混纺"会被误杀；
#     改收"吸大麻/买大麻/大麻烟"这类带动作的写法。
#   - "刀"不收裸词：厨刀/裁缝剪是合法商品，只收"管制刀具/弹簧刀/匕首"等明确管制的。
#   - "赌"不收裸词："赌一把"是口语梗，只收"赌博/赌场/博彩"等。
BANNED_CATEGORIES:
  - name: "涉毒"
    words:
      - "冰毒"
      - "海洛因"
      - "摇头丸"
      - "k粉"
      - "麻古"
      - "吸大麻"
      - "买大麻"
      - "卖大麻"
      - "大麻烟"
      - "贩毒"
      - "制毒"
  - name: "枪支弹药"
    words:
      - "枪支"
      - "手枪"
      - "步枪"
      - "仿真枪"
      - "气枪"
      - "钢珠枪"
      - "弹药"
      - "枪管"
  - name: "管制刀具"
    words:
      - "管制刀具"
      - "弹簧刀"
      - "跳刀"
      - "三棱刮刀"
      - "匕首"
      - "开山刀"
      - "砍刀"
  - name: "赌博"
    words:
      - "赌博"
      - "赌场"
      - "博彩"
      - "百家乐"
      - "六合彩"
      - "时时彩"
