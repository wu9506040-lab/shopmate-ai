# === 他人隐私请求（2026-11 补）===
# 货架电商（淘宝/抖店）里"查别的买家买了什么/手机号多少"是平台机制直接禁止的，
# 不需要 LLM 判断——但实测会抖：L01 多数轮次正常拒绝，偶发走订单专家补答，
# 把提问者自己的最近订单号带了出来（答案里出现 11 位数字，隐私用例判失败）。
#
# 命中条件：**他人指代 + 隐私项同时出现**。单看"别人"不拦——
# "别人都说这件起球"是正常面料咨询，"别人买的能退吗"是正常政策咨询。
# 所以他人词和隐私项必须分开两张表，任一单表命中都不拦。
OTHER_PRIVATE:
  reply: "抱歉，其他顾客的订单和个人信息我不能查看，也不能提供。您自己的订单、尺码、售后问题直接说，我来帮您查。"
  OTHER_WORDS:
    - "别人"
    - "其他人"
    - "其他顾客"
    - "其他买家"
    - "别的顾客"
    - "别的买家"
    - "上一个顾客"
    - "上一个买家"
    - "上一位顾客"
    - "上一位买家"
    - "前面那位"
    - "刚才那位"
    - "那个顾客"
    - "那个买家"
  # 只收强隐私项。"订单"不收裸词——"别人说订单要等三天"是正常咨询，
  # 收裸词会把这类问题一起推进拒答。
  PRIVATE_ITEMS:
    - "手机号"
    - "电话号码"
    - "联系方式"
    - "收货地址"
    - "收货人"
    - "真实姓名"
    - "买了什么"
    - "买过什么"
    - "买了啥"
    - "订单号"
    - "订单信息"
    - "聊天记录"