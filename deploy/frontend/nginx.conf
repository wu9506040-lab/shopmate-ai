# =============================================================
# Vue3 前端 - nginx 生产配置（企业级 /api/ 分层）
# 配套 deploy/docker-compose.yml 的 frontend 服务
#
# 关键设计：
#   1. /              → SPA 静态资源 + @spa fallback（Vue Router 接管）
#   2. /api/          → 反代 FastAPI 后端（API 路径空间隔离）
#   3. /api/chat      → SSE 流式（禁 buffer + HTTP/1.1 + 长 timeout）
#   4. /api/ 其他路径 → JSON 通用反代（buffer 开，吞吐优先）
# =============================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 20M;  # 知识库文件上传

    # Docker 内嵌 DNS 动态解析：api 容器重建/换 IP 后自动跟随
    # （静态 proxy_pass http://api:8000 只在启动时解析一次，容器换 IP 即 502）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vue3 SPA 静态资源 + fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @spa;  # 找不到文件 → SPA fallback
    }

    # 静态资源 cache（Vite 产物带 hash）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：所有未知路径 → index.html，让 Vue Router 处理
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ---------- Java 中台承载的路径 ----------
    # 路由粒度 = location；关闭对应 location 即回落到 Python（/api/ 兜底）

    # 鉴权（登录/登出/me）→ Java 中台（平台层是身份的唯一权威）
    location /api/auth/ {
        set $java_upstream http://java-api:8080;
        proxy_pass $java_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 会话/消息真源 → Java 中台（写入由网关 done 帧落库）
    location /api/conversations {
        set $java_upstream http://java-api:8080;
        proxy_pass $java_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 数据看板（精确匹配；其余 /api/admin/analytics* 仍走 AI 服务）
    location = /api/admin/analytics/board {
        set $java_upstream http://java-api:8080;
        proxy_pass $java_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 人工工单（坐席工作台）→ Java 中台
    location /api/admin/handoff {
        set $java_upstream http://java-api:8080;
        proxy_pass $java_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 问答 SSE → Java 网关（Java 鉴权/校验后透传 Python AI，并负责落库）
    location = /api/chat {
        set $java_upstream http://java-api:8080;
        proxy_pass $java_upstream;
        proxy_http_version 1.1;          # SSE 需要 keep-alive
        proxy_set_header Connection "";
        proxy_buffering off;            # SSE 必须实时推送
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ---------- /api/ 反代（通用 JSON，其余走 Python AI 服务）----------
    # 大部分 /api/* 是 JSON 请求，buffer 开提高吞吐
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;  # 用 $http_host 保留端口
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;  # 防止旧 301 浏览器缓存
    }

    # ---------- /api/chat 直连 Python 的旧路由（P5 已切 Java 网关，保留注释用于回滚）----------
    # 回滚方法：注释上面的 Java `location = /api/chat`，取消下面这个块的注释
    # location = /api/chat {
    #     set $api_upstream http://api:8000;
    #     proxy_pass $api_upstream;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Cache-Control "no-store" always;
    # }

    # 健康检查（nginx 层）
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}